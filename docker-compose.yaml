services:
  geant:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: geant:latest
    container_name: geant
    working_dir: /home/app/geant4-ws
    volumes:
      - ./geant4-ws:/home/app/geant4-ws
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    stdin_open: true
    tty: true
    init: true
